<svg width="480" height="160" viewBox="0 0 480 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo HUD -->
  <g transform="translate(80, 80)">
    <!-- Anillo exterior con segmentos maker -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#1D9E75" stroke-width="3" opacity="0.4"/>
    <path d="M 0,-45 A 45,45 0 0,1 31.8,-31.8" fill="none" stroke="#F0997B" stroke-width="4"/>
    <path d="M 31.8,31.8 A 45,45 0 0,1 0,45" fill="none" stroke="#EF9F27" stroke-width="4"/>

    <!-- Anillo medio -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="#5DCAA5" stroke-width="2.5" opacity="0.5"/>
    <path d="M 0,-32 A 32,32 0 0,1 22.6,-22.6" fill="none" stroke="#EF9F27" stroke-width="3"/>

    <!-- Anillo interno con elementos tech -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#1D9E75" stroke-width="2"/>
    <rect x="-2" y="-20" width="4" height="6" fill="#F0997B"/>
    <rect x="16" y="-2" width="6" height="4" fill="#EF9F27"/>
    <rect x="-2" y="14" width="4" height="6" fill="#5DCAA5"/>

    <!-- Centro -->
    <circle cx="0" cy="0" r="8" fill="#1D9E75" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#5DCAA5"/>

    <!-- Elementos maker (trazas PCB) -->
    <line x1="35" y1="0" x2="42" y2="0" stroke="#EF9F27" stroke-width="1.5"/>
    <circle cx="42" cy="0" r="2" fill="#EF9F27"/>
    <line x1="-25" y1="25" x2="-32" y2="32" stroke="#1D9E75" stroke-width="1.5"/>
    <circle cx="-32" cy="32" r="2" fill="#1D9E75"/>
  </g>

  <!-- Tipografía horizontal -->
  <text x="160" y="70" style="font-family: sans-serif; font-size: 42px; font-weight: 500; fill: #2C2C2A;">0xDAbit</text>
  <text x="160" y="105" style="font-family: sans-serif; font-size: 28px; font-weight: 400; fill: #5F5E5A; letter-spacing: 2px;">LABS</text>
  <rect x="160" y="110" width="90" height="2" fill="#1D9E75"/>
</svg>
